name: Automated Database Backup

on:
  schedule:
    # Runs everyday at 20:30 UTC (02:00 AM IST)
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    name: Export Database & Sync to GitHub + Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Runtime Dependencies
        run: npm install --omit=dev --no-audit --prefer-offline

      - name: Export Database & Upload to Google Drive
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbz4Xx1qZKkXiR03Ok8RazqYgVGImQce5WUJlQPWSUuSM7obVZOe2DxEBcdLm-Y7VgZrgA/exec' }}
        run: |
          if [ -z "${MONGO_URI:-}" ]; then
            echo "❌ Missing GitHub secret MONGO_URI! Please add it under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          node scripts/export_database_backup.js

      - name: Checkout Backups Branch
        uses: actions/checkout@v4
        with:
          ref: database-backups
          path: repo-backups
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Backup to database-backups Branch
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          mkdir -p repo-backups/backups
          cp -r server/data/backups/* repo-backups/backups/ 2>/dev/null || true

          cd repo-backups
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backups/

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit (backup already up to date)."
          else
            git commit -m "chore(backup): automated snapshot ${TIMESTAMP} [skip ci]"
            git push origin database-backups
            echo "✅ Successfully pushed database backup to branch 'database-backups'."
          fi
